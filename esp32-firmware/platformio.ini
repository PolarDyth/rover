[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build settings
build_type = release
board_build.arduino.memory_type = qio_opi

; Libraries
lib_deps =
    FastLED
